<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tu lavado en vivo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --carbon:#0B0E11; --carbon2:#121820; --linea:#1d2733;
    --agua:#22D3EE; --agua2:#0EA5B5; --teal:#0b8a9c;
    --blanco:#F3F7FA; --suave:#8A9AA8; --tenue:#56687a;
    --oro:#D4A84B; --verde:#34D399;
  }
  html,body{min-height:100%;}
  body{
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:
      radial-gradient(130% 80% at 50% -10%, #16202b 0%, rgba(11,14,17,0) 55%),
      radial-gradient(90% 60% at 50% 120%, #10303a 0%, rgba(11,14,17,0) 60%),
      var(--carbon);
    background-attachment:fixed;
    color:var(--blanco);-webkit-font-smoothing:antialiased;
    min-height:100vh;padding:max(26px,env(safe-area-inset-top)) 20px 40px;
  }
  .lienzo{max-width:440px;margin:0 auto;}

  /* Encabezado */
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;}
  .top .neg{display:flex;align-items:center;gap:10px;}
  .top .marca-ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--agua),var(--teal));display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 0 22px rgba(34,211,238,.35);}
  .top .neg b{font-size:15px;font-weight:600;letter-spacing:.2px;}
  .vivo{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--suave);}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:latir 2s infinite;}
  @keyframes latir{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5);}70%{box-shadow:0 0 0 9px rgba(52,211,153,0);}100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}

  /* Placa */
  .placa{font-size:clamp(40px,13vw,58px);font-weight:800;letter-spacing:2px;line-height:.95;text-align:center;}
  .cliente{text-align:center;color:var(--suave);font-size:14px;margin-top:8px;font-weight:300;}

  /* Escenario del auto */
  .escena{position:relative;margin:18px 0 6px;height:210px;display:flex;align-items:center;justify-content:center;}
  .halo{position:absolute;width:290px;height:150px;border-radius:50%;background:radial-gradient(ellipse at center, rgba(34,211,238,.18), rgba(34,211,238,0) 70%);filter:blur(6px);bottom:28px;transition:background .8s;}
  .auto-svg{position:relative;width:300px;max-width:84%;height:auto;z-index:2;}
  .piso{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:230px;height:10px;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(7px);}

  /* Gotas / espuma / brillo overlay */
  .fx{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .gota{position:absolute;width:3px;height:12px;border-radius:3px;background:linear-gradient(var(--agua),rgba(34,211,238,0));opacity:0;animation:caer 1.3s linear infinite;}
  @keyframes caer{0%{transform:translateY(-14px);opacity:0;}20%{opacity:.9;}100%{transform:translateY(120px);opacity:0;}}
  .espuma{position:absolute;border-radius:50%;background:rgba(255,255,255,.9);opacity:0;animation:burbuja 2.2s ease-in-out infinite;}
  @keyframes burbuja{0%{transform:translateY(8px) scale(.6);opacity:0;}30%{opacity:.85;}100%{transform:translateY(-26px) scale(1);opacity:0;}}
  .destello{position:absolute;top:34%;left:18%;width:40px;height:40px;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);opacity:0;animation:brillar 2.6s ease-in-out infinite;}
  @keyframes brillar{0%,100%{opacity:0;transform:scale(.4);}50%{opacity:1;transform:scale(1);}}

  /* Fase y progreso */
  .fase-zona{text-align:center;margin-top:4px;}
  .fase-num{font-size:12px;letter-spacing:3px;color:var(--tenue);text-transform:uppercase;}
  .fase-nom{font-size:clamp(30px,8vw,40px);font-weight:700;margin:4px 0 2px;background:linear-gradient(90deg,var(--blanco),var(--agua));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .track{height:4px;background:var(--linea);border-radius:20px;overflow:hidden;margin:20px 0 14px;}
  .track-fill{height:100%;background:linear-gradient(90deg,var(--agua2),var(--agua));border-radius:20px;transition:width 1s cubic-bezier(.4,0,.2,1);box-shadow:0 0 14px rgba(34,211,238,.6);}
  .pasos{display:flex;justify-content:space-between;gap:4px;}
  .paso{flex:1;text-align:center;font-size:10px;color:var(--tenue);letter-spacing:.2px;transition:color .5s;}
  .paso .pto{width:9px;height:9px;border-radius:50%;background:var(--linea);margin:0 auto 6px;transition:all .5s;}
  .paso.hecha .pto{background:var(--verde);}
  .paso.hecha{color:var(--suave);}
  .paso.actual .pto{background:var(--agua);box-shadow:0 0 0 4px rgba(34,211,238,.18);}
  .paso.actual{color:var(--agua);font-weight:600;}

  /* Tarjeta de datos */
  .datos{margin-top:26px;border:1px solid var(--linea);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));overflow:hidden;}
  .dato{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--linea);}
  .dato:last-child{border-bottom:0;}
  .dato .k{color:var(--suave);font-size:13px;font-weight:300;}
  .dato .v{font-size:15px;font-weight:600;}
  .dato .v.precio{color:var(--agua);}

  /* Estados especiales */
  .aviso{margin-top:16px;border:1px solid #3a3115;background:rgba(212,168,75,.08);color:var(--oro);border-radius:14px;padding:13px 16px;font-size:14px;text-align:center;}
  .final{text-align:center;padding:14px 0;}
  .final .emoji{font-size:54px;filter:drop-shadow(0 6px 20px rgba(34,211,238,.4));}
  .final h2{font-size:26px;font-weight:700;margin:12px 0 4px;}
  .final p{color:var(--suave);font-size:14px;font-weight:300;}

  /* Calificación */
  .califica{margin-top:24px;border:1px solid var(--linea);border-radius:18px;padding:24px 20px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0));}
  .califica h3{font-size:18px;font-weight:600;margin-bottom:4px;}
  .califica .sub{color:var(--suave);font-size:13px;font-weight:300;margin-bottom:16px;}
  .estrellas{display:flex;justify-content:center;gap:10px;margin-bottom:16px;}
  .estrella{font-size:40px;color:#263241;cursor:pointer;transition:transform .15s,color .2s;line-height:1;}
  .estrella:active{transform:scale(.9);}
  .estrella.on{color:var(--oro);text-shadow:0 0 18px rgba(212,168,75,.5);}
  .coment{width:100%;background:var(--carbon2);border:1px solid var(--linea);border-radius:12px;padding:12px;color:var(--blanco);font-family:inherit;font-size:14px;resize:vertical;min-height:58px;margin-bottom:14px;}
  .coment::placeholder{color:var(--tenue);}
  .btn{width:100%;border:0;border-radius:12px;padding:15px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,var(--agua),var(--teal));color:#042229;box-shadow:0 8px 24px rgba(34,211,238,.25);transition:transform .15s,opacity .2s;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.4;box-shadow:none;cursor:default;}
  .gracias{color:var(--oro);font-size:16px;font-weight:600;margin-top:4px;}
  .gracias .est{letter-spacing:3px;font-size:22px;}

  .estado-cargando,.estado-error{text-align:center;color:var(--suave);padding:70px 20px;font-weight:300;}
  .estado-error .ic{font-size:40px;display:block;margin-bottom:12px;}
  .pie{text-align:center;font-size:11px;color:var(--tenue);margin-top:26px;font-weight:300;}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="lienzo">
  <div class="top">
    <div class="neg"><span class="marca-ico">💧</span><b id="negocio">{{ configuracion.nombre_negocio }}</b></div>
    <div class="vivo"><span class="punto"></span>En vivo</div>
  </div>
  <div id="contenido"><div class="estado-cargando">Conectando con tu servicio…</div></div>
  <div class="pie">Actualización automática · deja esta pantalla abierta</div>
</div>

<script>
  "use strict";
  var CODIGO = {{ codigo|tojson }};
  var yaCalifico = false, estrellaSel = 0;

  function escapar(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  // Silueta de auto en SVG. El "tono" del body cambia según avance.
  var _autoSvgN = 0;
  function autoSVG(tint){
    var id = "a" + (_autoSvgN++);
    function rueda(cx){
      return '<g>'
        + '<circle cx="'+cx+'" cy="150" r="26" fill="#0a0e12"/>'            // llanta
        + '<circle cx="'+cx+'" cy="150" r="26" fill="none" stroke="'+tint.edge+'" stroke-width="1.5" opacity=".5"/>'
        + '<circle cx="'+cx+'" cy="150" r="14" fill="#18232e"/>'            // rin
        + '<circle cx="'+cx+'" cy="150" r="14" fill="none" stroke="url(#rim'+id+')" stroke-width="2"/>'
        // rayos del rin
        + '<g stroke="url(#rim'+id+')" stroke-width="2.4" stroke-linecap="round">'
        +   '<line x1="'+cx+'" y1="139" x2="'+cx+'" y2="161"/>'
        +   '<line x1="'+(cx-10)+'" y1="144" x2="'+(cx+10)+'" y2="156"/>'
        +   '<line x1="'+(cx-10)+'" y1="156" x2="'+(cx+10)+'" y2="144"/>'
        + '</g>'
        + '<circle cx="'+cx+'" cy="150" r="3.5" fill="'+tint.edge+'"/>'     // centro
        + '</g>';
    }
    return '<svg class="auto-svg" viewBox="0 0 420 185" fill="none" xmlns="http://www.w3.org/2000/svg">'
      + '<defs>'
      +   '<linearGradient id="body'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+tint.top+'"/><stop offset="1" stop-color="'+tint.bot+'"/></linearGradient>'
      +   '<linearGradient id="glass'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#32475c"/><stop offset="1" stop-color="#121c26"/></linearGradient>'
      +   '<linearGradient id="rim'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef6f9"/><stop offset="1" stop-color="'+tint.edge+'"/></linearGradient>'
      +   '<linearGradient id="shine'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(255,255,255,'+(tint.shine)+')"/><stop offset=".5" stop-color="rgba(255,255,255,0)"/></linearGradient>'
      + '</defs>'
      // sombra en el piso
      + '<ellipse cx="210" cy="176" rx="170" ry="9" fill="rgba(0,0,0,.45)"/>'
      // carrocería: coupé deportivo fluido
      + '<path d="M26 128 '
      +   'C26 118 34 112 46 110 '              // guardabarros trasero
      +   'L92 104 '
      +   'C104 88 124 74 150 68 '              // cristal trasero / cajuela
      +   'L198 54 '
      +   'C228 48 262 50 288 64 '              // techo hacia el frente
      +   'L322 86 '
      +   'L372 96 '                            // cofre
      +   'C392 100 404 108 404 122 '           // morro
      +   'L404 132 '
      +   'C404 138 400 142 394 142 '
      +   'L34 142 '
      +   'C29 142 26 138 26 132 Z" '
      +   'fill="url(#body'+id+')" stroke="'+tint.edge+'" stroke-width="2"/>'
      // línea de carácter lateral
      + '<path d="M58 124 L360 118" stroke="'+tint.edge+'" stroke-width="1.5" opacity=".35"/>'
      // ventanas (dos cristales con pilar)
      + '<path d="M150 72 C168 64 192 60 212 60 L246 64 L244 96 L138 96 C140 86 144 78 150 72 Z" fill="url(#glass'+id+')"/>'
      + '<path d="M252 64 C268 66 282 72 296 82 L312 96 L252 96 Z" fill="url(#glass'+id+')"/>'
      // reflejo diagonal en la carrocería
      + '<path d="M120 112 L300 78 L318 90 L138 126 Z" fill="url(#shine'+id+')" opacity=".9"/>'
      // faro delantero
      + '<path d="M392 116 C398 116 400 120 400 124 L386 126 L386 118 Z" fill="'+tint.edge+'" opacity=".9"/>'
      // manija
      + '<rect x="196" y="110" width="22" height="4" rx="2" fill="'+tint.edge+'" opacity=".55"/>'
      // ruedas
      + rueda(96) + rueda(330)
      + '</svg>';
  }

  // Overlay de efectos por fase (agua, espuma, brillo)
  function efectos(tipo){
    if(tipo === "agua"){
      var g = "";
      for(var i=0;i<14;i++){ g += '<span class="gota" style="left:'+(12+i*6)+'%;animation-delay:'+(i*0.09)+'s"></span>'; }
      return '<div class="fx">'+g+'</div>';
    }
    if(tipo === "espuma"){
      var e = "";
      for(var j=0;j<16;j++){ var s=4+Math.round(Math.random()*7); e += '<span class="espuma" style="left:'+(14+j*5)+'%;bottom:'+(30+Math.random()*40)+'px;width:'+s+'px;height:'+s+'px;animation-delay:'+(j*0.13)+'s"></span>'; }
      return '<div class="fx">'+e+'</div>';
    }
    if(tipo === "brillo"){
      return '<div class="fx"><span class="destello" style="left:20%"></span><span class="destello" style="left:55%;animation-delay:1.1s"></span><span class="destello" style="left:78%;animation-delay:.6s"></span></div>';
    }
    return "";
  }

  // Mapea el avance (0..1) a apariencia del auto y tipo de efecto
  function apariencia(idx, total){
    var p = total > 1 ? idx/(total-1) : 1;
    // Sucio (opaco) -> limpio (brillante azulado)
    if(p < 0.34) return {tint:{top:"#3a4653",bot:"#222b34",edge:"#55707f",shine:.05}, fx:"agua"};
    if(p < 0.67) return {tint:{top:"#5b7a8a",bot:"#2f4350",edge:"#7fb6c6",shine:.14}, fx:"espuma"};
    if(p < 0.99) return {tint:{top:"#7fb9c9",bot:"#3a5d6b",edge:"#b4e4f0",shine:.25}, fx:"agua"};
    return {tint:{top:"#a9e6f3",bot:"#4e7f8e",edge:"#d9f6fc",shine:.4}, fx:"brillo"};
  }

  async function cargar(){
    try{
      var r = await fetch("/api/seguimiento/"+encodeURIComponent(CODIGO),{cache:"no-store"});
      if(r.status === 404){ return error("No encontramos un servicio con este código.\\nVerifica el enlace o el QR."); }
      var d = await r.json();
      if(!d.ok){ return error(d.error || "No se pudo cargar tu servicio."); }
      pintar(d.vehiculo);
    }catch(e){ /* reintenta en el siguiente ciclo */ }
  }

  function error(msg){
    document.getElementById("contenido").innerHTML =
      '<div class="estado-error"><span class="ic">🔍</span>'+escapar(msg).replace(/\\n/g,"<br>")+'</div>';
  }

  function pintar(v){
    document.getElementById("negocio").textContent = v.negocio || "Autolavado";
    var fases = v.fases || [];
    var cont = document.getElementById("contenido");

    if(v.estado === "Entregado"){ cont.innerHTML = vistaFinal(v); engancharEstrellas(); return; }

    var html = '<div class="placa">'+escapar(v.placa || "Tu auto")+'</div>'
      + (v.nombre ? '<div class="cliente">'+escapar(v.nombre)+'</div>' : '');

    if(v.estado === "Espera"){
      html += escena(apariencia(0,Math.max(1,fases.length)))
        + '<div class="aviso">Tu vehículo está en recepción. Comenzamos en un momento.</div>';
    } else if(v.estado === "Listo"){
      html += escena({tint:{top:"#a9e6f3",bot:"#4e7f8e",edge:"#d9f6fc",shine:.4},fx:"brillo"})
        + '<div class="fase-zona"><div class="fase-nom">Listo para entrega</div></div>';
    } else { // En proceso
      var idx = typeof v.faseActual === "number" ? v.faseActual : 0;
      if(fases.length) idx = Math.max(0, Math.min(idx, fases.length-1));
      var faseNom = fases[idx] ? fases[idx].nombre : "En proceso";
      var pct = fases.length ? Math.round(((idx+1)/fases.length)*100) : 0;
      var ap = apariencia(idx, Math.max(1,fases.length));

      html += escena(ap, v.pausado)
        + '<div class="fase-zona">'
        +   '<div class="fase-num">Fase '+(idx+1)+' de '+fases.length+'</div>'
        +   '<div class="fase-nom">'+escapar(faseNom)+'</div>'
        + '</div>'
        + (v.pausado ? '<div class="aviso">En pausa un momento. Enseguida continuamos.</div>' : '')
        + '<div class="track"><div class="track-fill" style="width:'+pct+'%"></div></div>'
        + '<div class="pasos">'+fases.map(function(f,k){
            var c = k<idx ? "paso hecha" : (k===idx ? "paso actual" : "paso");
            return '<div class="'+c+'"><span class="pto"></span>'+escapar(f.nombre)+'</div>';
          }).join('')+'</div>';
    }

    // Datos del servicio
    html += '<div class="datos">'
      + fila("Servicio", v.lavado)
      + (v.precio != null ? fila("Total", "$"+v.precio, true) : "")
      + fila("Espacio", v.bahia)
      + fila("Atiende", v.resp)
      + (v.entrega ? fila("Entrega estimada", v.entrega + " h") : "")
      + '</div>';

    cont.innerHTML = html;
  }

  function escena(ap, pausado){
    return '<div class="escena">'
      + '<div class="halo"></div>'
      + autoSVG(ap.tint)
      + (pausado ? "" : efectos(ap.fx))
      + '<div class="piso"></div>'
      + '</div>';
  }

  function fila(k,val,esPrecio){
    if(!val) return "";
    return '<div class="dato"><span class="k">'+escapar(k)+'</span><span class="v'+(esPrecio?' precio':'')+'">'+escapar(val)+'</span></div>';
  }

  function vistaFinal(v){
    var base = '<div class="final"><div class="emoji">✨</div><h2>¡Tu auto está listo!</h2><p>Gracias por confiar en nosotros.</p></div>'
      + '<div class="datos">'+fila("Servicio",v.lavado)+(v.precio!=null?fila("Total","$"+v.precio,true):"")+fila("Atendió",v.resp)+'</div>';
    if(v.calif > 0 || yaCalifico){
      var est = v.calif > 0 ? '<div class="gracias"><div class="est">'+"★".repeat(v.calif)+"☆".repeat(5-v.calif)+'</div>Gracias por tu calificación</div>' : '<div class="gracias">¡Gracias por calificar!</div>';
      return base + '<div class="califica">'+est+'</div>';
    }
    return base + '<div class="califica"><h3>¿Cómo quedó tu auto?</h3><div class="sub">Tu opinión nos ayuda a mejorar</div>'
      + '<div class="estrellas" id="estrellas">'+[1,2,3,4,5].map(function(n){return '<span class="estrella" data-n="'+n+'">★</span>';}).join('')+'</div>'
      + '<textarea class="coment" id="coment" placeholder="Comentario (opcional)"></textarea>'
      + '<button class="btn" id="btnCal" disabled>Enviar calificación</button></div>';
  }

  function engancharEstrellas(){
    var cont = document.getElementById("estrellas");
    if(!cont) return;
    cont.querySelectorAll(".estrella").forEach(function(e){
      e.addEventListener("click", function(){
        estrellaSel = Number(e.dataset.n);
        cont.querySelectorAll(".estrella").forEach(function(x){ x.classList.toggle("on", Number(x.dataset.n) <= estrellaSel); });
        document.getElementById("btnCal").disabled = false;
      });
    });
    var btn = document.getElementById("btnCal");
    if(btn) btn.addEventListener("click", enviarCalif);
  }

  async function enviarCalif(){
    if(estrellaSel < 1) return;
    var btn = document.getElementById("btnCal");
    btn.disabled = true; btn.textContent = "Enviando…";
    try{
      var r = await fetch("/api/seguimiento/"+encodeURIComponent(CODIGO)+"/calificar",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({estrellas:estrellaSel, comentario:(document.getElementById("coment").value||"")})
      });
      var d = await r.json();
      if(d.ok){ yaCalifico = true; cargar(); }
      else { btn.disabled=false; btn.textContent="Enviar calificación"; }
    }catch(e){ btn.disabled=false; btn.textContent="Enviar calificación"; }
  }

  cargar();
  setInterval(cargar, 10000);
</script>
</body>
</html>
