<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ configuracion.nombre_negocio }} — Central de lavado</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --carbon:#0B0E11; --carbon2:#121820; --linea:#1d2733;
    --agua:#22D3EE; --agua2:#0EA5B5; --teal:#0b8a9c;
    --blanco:#F3F7FA; --suave:#8A9AA8; --tenue:#56687a;
    --oro:#D4A84B; --verde:#34D399;
  }
  html,body{height:100%;}
  body{
    background:
      radial-gradient(120% 70% at 50% -5%, #16202b 0%, rgba(11,14,17,0) 55%),
      var(--carbon);
    color:var(--blanco);
    font-family:"Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  .barra-top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--linea);}
  .barra-top .marca{display:flex;align-items:center;gap:11px;}
  .barra-top .ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--agua),var(--teal));display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 0 22px rgba(34,211,238,.35);}
  .barra-top h1{font-size:16px;font-weight:600;}
  .barra-top h1 small{color:var(--suave);font-weight:300;margin-left:8px;}
  .top-right{display:flex;align-items:center;gap:22px;}
  .vivo{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--suave);}
  .punto{width:8px;height:8px;border-radius:50%;background:var(--verde);animation:latir 2s infinite;}
  @keyframes latir{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5);}70%{box-shadow:0 0 0 9px rgba(52,211,153,0);}100%{box-shadow:0 0 0 0 rgba(52,211,153,0);}}
  .reloj{font-size:19px;font-variant-numeric:tabular-nums;color:var(--agua);font-weight:600;}

  #grid{height:calc(100vh - 60px);display:grid;gap:14px;padding:14px;}
  #grid.g1{grid-template-columns:1fr;grid-template-rows:1fr;}
  #grid.g2{grid-template-columns:1fr 1fr;grid-template-rows:1fr;}
  #grid.g3{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr;}
  #grid.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
  @media(max-width:860px){
    #grid.g2,#grid.g3,#grid.g4{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:minmax(300px,1fr);height:auto;overflow-y:auto;}
    body{overflow:auto;}
  }

  .panel{
    border:1px solid var(--linea);border-radius:20px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;padding:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)), var(--carbon2);
  }
  .panel.pausado{border-color:rgba(212,168,75,.5);}
  .p-head{display:flex;justify-content:space-between;align-items:flex-start;z-index:4;position:relative;}
  .placa{font-size:clamp(28px,3.4vw,52px);font-weight:800;letter-spacing:1.5px;line-height:.95;}
  .cliente{color:var(--suave);font-size:14px;margin-top:6px;font-weight:300;}
  .servicio{display:inline-block;background:rgba(34,211,238,.1);color:var(--agua);font-size:12px;padding:4px 11px;border-radius:20px;margin-top:8px;}
  .bahia-tag{background:rgba(255,255,255,.04);border:1px solid var(--linea);color:var(--agua);font-size:13px;font-weight:700;padding:7px 13px;border-radius:20px;white-space:nowrap;}

  /* Escena del auto dentro del panel */
  .escena{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:90px;margin:8px 0;}
  .halo{position:absolute;width:62%;height:55%;border-radius:50%;background:radial-gradient(ellipse at center, rgba(34,211,238,.16), rgba(34,211,238,0) 70%);filter:blur(5px);}
  .auto-svg{position:relative;width:min(82%,340px);height:auto;z-index:2;}
  .fx{position:absolute;inset:0;z-index:3;pointer-events:none;}
  .gota{position:absolute;width:3px;height:12px;border-radius:3px;background:linear-gradient(var(--agua),rgba(34,211,238,0));opacity:0;animation:caer 1.3s linear infinite;}
  @keyframes caer{0%{transform:translateY(-14px);opacity:0;}20%{opacity:.9;}100%{transform:translateY(90px);opacity:0;}}
  .espuma{position:absolute;border-radius:50%;background:rgba(255,255,255,.9);opacity:0;animation:burbuja 2.2s ease-in-out infinite;}
  @keyframes burbuja{0%{transform:translateY(8px) scale(.6);opacity:0;}30%{opacity:.85;}100%{transform:translateY(-24px) scale(1);opacity:0;}}
  .destello{position:absolute;width:38px;height:38px;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);opacity:0;animation:brillar 2.6s ease-in-out infinite;}
  @keyframes brillar{0%,100%{opacity:0;transform:scale(.4);}50%{opacity:1;transform:scale(1);}}

  .fase-nom{font-size:clamp(22px,2.8vw,40px);font-weight:700;background:linear-gradient(90deg,var(--blanco),var(--agua));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;z-index:4;position:relative;}
  .fase-meta{color:var(--tenue);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-top:2px;z-index:4;position:relative;}
  .track{height:5px;background:var(--linea);border-radius:20px;overflow:hidden;margin:14px 0 12px;z-index:4;position:relative;}
  .track-fill{height:100%;background:linear-gradient(90deg,var(--agua2),var(--agua));border-radius:20px;transition:width 1s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(34,211,238,.55);}
  .pie{display:flex;justify-content:space-between;align-items:center;z-index:4;position:relative;}
  .resp{color:var(--suave);font-size:13px;}
  .tiempo{color:var(--suave);font-size:13px;font-variant-numeric:tabular-nums;}
  .pausa-flag{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--oro);color:#2a2000;font-weight:700;font-size:12px;padding:5px 14px;border-radius:20px;z-index:5;}

  .vacio{height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;}
  .vacio .ico{font-size:60px;filter:drop-shadow(0 6px 22px rgba(34,211,238,.35));}
  .vacio h2{font-weight:600;font-size:22px;}
  .vacio p{color:var(--suave);font-weight:300;}

  /* Silueta real con agua: el nivel sube suave según el avance */
  .veh-svg{position:relative;width:min(86%,360px);height:auto;z-index:2;filter:drop-shadow(0 10px 22px rgba(0,0,0,.45));}
  .veh-svg .agua-nivel,.veh-svg .agua-linea{transition:y 1.1s cubic-bezier(.4,0,.2,1);}
  .veh-svg .agua-linea{animation:oleaje 2.4s ease-in-out infinite;}
  @keyframes oleaje{0%,100%{opacity:.75;}50%{opacity:1;}}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
  <div class="barra-top">
    <div class="marca"><span class="ico">💧</span><h1><b id="negocio">{{ configuracion.nombre_negocio }}</b><small>Central de lavado</small></h1></div>
    <div class="top-right">
      <div class="vivo"><span class="punto"></span>En vivo</div>
      <div class="reloj" id="reloj">--:--</div>
    </div>
  </div>
  <div id="grid" class="g1"></div>

<script src="/static/vehiculos.js"></script>
<script>
  "use strict";
  var CONFIG = {}, vehiculos = [];
  function escapar(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function fasesActivas(){ return (CONFIG.fases||[]).filter(function(f){return f.activo!==false;}); }
  function minutosDesde(iso){ if(!iso) return 0; var t=new Date(iso).getTime(); return isNaN(t)?0:Math.max(0,Math.floor((Date.now()-t)/60000)); }

  // Efectos ambientales (gotas/espuma/brillo) alrededor del vehículo.
  function efectos(tipo){
    if(tipo==="agua"){ var g=""; for(var i=0;i<12;i++){ g+='<span class="gota" style="left:'+(14+i*6)+'%;animation-delay:'+(i*0.1)+'s"></span>'; } return '<div class="fx">'+g+'</div>'; }
    if(tipo==="espuma"){ var e=""; for(var j=0;j<14;j++){ var s=4+Math.round(Math.random()*6); e+='<span class="espuma" style="left:'+(16+j*5)+'%;bottom:'+(20+Math.random()*40)+'%;width:'+s+'px;height:'+s+'px;animation-delay:'+(j*0.14)+'s"></span>'; } return '<div class="fx">'+e+'</div>'; }
    if(tipo==="brillo"){ return '<div class="fx"><span class="destello" style="top:30%;left:22%"></span><span class="destello" style="top:40%;left:58%;animation-delay:1.1s"></span></div>'; }
    return "";
  }
  // Según el avance, elige el efecto ambiental y el color del agua.
  function ambiente(pct){
    if(pct<34) return {fx:"agua",  a1:"#5fd0ff", a2:"#1b7fd4"};
    if(pct<67) return {fx:"espuma",a1:"#9fe4ff", a2:"#2f6fae"};
    if(pct<100)return {fx:"agua",  a1:"#7fe0ef", a2:"#1b9bc4"};
    return            {fx:"brillo",a1:"#a9f0ff", a2:"#2bb6d6"};
  }

  async function cargar(){
    try{
      // /api/monitor es público y de solo lectura (la pantalla no tiene sesión).
      var re=await fetch("/api/monitor",{cache:"no-store"});
      if(re.ok){
        var d=await re.json();
        CONFIG = {fases:(d.fases||[]), nombre_negocio:d.nombre_negocio};
        vehiculos = d.vehiculos || [];
      }
      document.getElementById("negocio").textContent = (CONFIG.nombre_negocio) || "Autolavado";
      pintar();
    }catch(e){}
  }

  function pintar(){
    var fases = fasesActivas();
    var activos = vehiculos.filter(function(v){return v.estado==="En proceso";}).slice(0,4);
    var grid = document.getElementById("grid");
    if(!activos.length){
      grid.className="";
      grid.innerHTML='<div class="vacio"><div class="ico">💧</div><h2>Sin autos en lavado</h2><p>El avance de cada servicio aparecerá aquí en cuanto comience.</p></div>';
      return;
    }
    grid.className="g"+activos.length;
    grid.innerHTML = activos.map(function(v,n){
      var idx = typeof v.faseActual==="number"?v.faseActual:0;
      if(fases.length) idx=Math.max(0,Math.min(idx,fases.length-1));
      var faseNom = fases[idx]?fases[idx].nombre:"En proceso";
      var pct = fases.length?Math.round(((idx+1)/fases.length)*100):0;
      var amb = ambiente(pct);
      var pausado = !!v.pausaInicio;
      var tiempoTxt = v.inicioReal ? ("Lleva "+minutosDesde(v.inicioReal)+" min") : "";
      var svg = svgVehiculoAgua(v.tipoVehiculo, pct, {id:"m"+n, colorAgua1:amb.a1, colorAgua2:amb.a2, colorBase:"#2a3542"});
      return '<div class="panel'+(pausado?' pausado':'')+'">'
        + '<div class="p-head"><div><div class="placa">'+escapar(v.placa||v.sub||"—")+'</div>'
        +   (v.nombre?'<div class="cliente">'+escapar(v.nombre)+'</div>':'')
        +   '<span class="servicio">'+escapar(v.lavado||"")+'</span></div>'
        +   '<span class="bahia-tag">'+escapar(v.bahia||"")+'</span></div>'
        + '<div class="escena"><div class="halo"></div>'+svg+(pausado?"":efectos(amb.fx))
        +   (pausado?'<div class="pausa-flag">⏸ En pausa</div>':'')+'</div>'
        + '<div class="fase-nom">'+escapar(faseNom)+'</div>'
        + '<div class="fase-meta">Fase '+(idx+1)+' de '+fases.length+'</div>'
        + '<div class="track"><div class="track-fill" style="width:'+pct+'%"></div></div>'
        + '<div class="pie"><span class="resp">'+escapar(v.resp||"")+'</span><span class="tiempo">'+escapar(tiempoTxt)+'</span></div>'
        + '</div>';
    }).join("");
  }

  function tictac(){ var d=new Date(); document.getElementById("reloj").textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0"); }
  cargar(); tictac();
  setInterval(tictac,1000);
  setInterval(cargar,8000);
</script>
</body>
</html>
